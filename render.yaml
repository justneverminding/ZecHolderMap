services:
  - type: web
    name: zec-holder-map
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python backend/server.py
    healthCheckPath: /api/stats
    autoDeploy: true
    envVars:
      - key: HOLDER_MAP_HOST
        value: "0.0.0.0"
      - key: HOLDER_MAP_DATABASE
        fromDatabase:
          name: holder_map
          property: connectionString

databases:
  - name: holder_map
    plan: free